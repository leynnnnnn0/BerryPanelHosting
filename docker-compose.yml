services:
  website:
    build: .
    container_name: berrypanel-main
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - web
    depends_on:
      - mysql
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.berrypanel.rule=Host(`berrypanel.localhost`)"
      - "traefik.http.services.berrypanel.loadbalancer.server.port=8000"

  queue-worker:
    build: .
    container_name: berrypanel-queue
    command: ["php", "artisan", "queue:work", "--tries=3"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - web
    depends_on:
      - mysql
      - website

  reverb:
    build: .
    container_name: berrypanel-reverb
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.reverb.rule=Host(`ws.berrypanel.localhost`)"
      - "traefik.http.services.reverb.loadbalancer.server.port=8080"

  mysql:
    image: mysql:8.0
    container_name: berrypanel-mysql
    restart: always
    command: --require_secure_transport=OFF
    environment:
      MYSQL_DATABASE: berrypanel
      MYSQL_USER: berrypanel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - berrypanel-mysql-data:/var/lib/mysql
    networks:
      - web

networks:
  web:
    external: true

volumes:
  berrypanel-mysql-data: